<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperación - Fractura distal</title>

<style>
body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: radial-gradient(circle at center, #050505, #000);
    color: #e6e6e6;
    overflow-x: hidden;
    transition: 0.2s;
}

/* NAV FLOTANTE */
nav {
    position: fixed;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.9);
    padding: 15px;
    border-radius: 15px;
    z-index: 1000;
}

nav a {
    color: #bbb;
    display: block;
    margin: 10px 0;
    text-decoration: none;
}

nav a:hover {
    color: red;
    text-shadow: 0 0 10px red;
}

/* HEADER */
header {
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* TITULO */
.titulo {
    font-size: clamp(24px, 5vw, 50px);
    text-shadow: 0 0 15px red;
    z-index: 2;
}

/* IMÁGENES FLOTANTES */
.floating-img {
    position: absolute;
    width: 150px;
    opacity: 0.6;
    transition: 0.3s;
    filter: grayscale(100%);
}

.floating-img:hover {
    transform: scale(1.7);
    opacity: 1;
    filter: grayscale(0%) contrast(130%);
    animation: temblor 0.2s infinite;
}

@keyframes temblor {
    0% { transform: translate(0,0); }
    25% { transform: translate(2px,-2px); }
    50% { transform: translate(-2px,2px); }
    75% { transform: translate(2px,2px); }
    100% { transform: translate(0,0); }
}

/* POSICIONES */
.img1 { top: 10%; left: 5%; }
.img2 { top: 15%; right: 10%; }
.img3 { bottom: 15%; left: 10%; }
.img4 { bottom: 10%; right: 5%; }
.img5 { top: 50%; left: 40%; }
.img6 { top: 30%; left: 70%; }
.img7 { bottom: 30%; right: 30%; }

/* SECCIONES */
section {
    padding: 80px 20px;
    max-width: 900px;
    margin: auto;
}

.card {
    background: rgba(10,10,10,0.9);
    padding: 25px;
    border-left: 3px solid red;
}

/* BOTÓN */
.contacto {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    background: darkred;
    border-radius: 50%;
    animation: latido 1s infinite;
    z-index: 1001;
    cursor: pointer;
}

@keyframes latido {
    50% { transform: scale(1.2); }
}

/* TOOLTIP */
.tooltip {
    position: fixed;
    bottom: 95px;
    right: 25px;
    background: black;
    padding: 10px;
    opacity: 0;
    transition: 0.3s;
    color: white;
    border-left: 3px solid red;
}

.contacto:hover + .tooltip {
    opacity: 1;
}

/* GLITCH */
.glitch {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        transparent 2px
    );
    z-index: 999;
}

/* MENSAJE */
.mensaje {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    color: red;
    font-size: 20px;
    opacity: 0;
    transition: 0.5s;
    text-shadow: 0 0 10px red;
    pointer-events: none;
}
</style>
</head>

<body>

<audio id="audio">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f4c3e6c0e.mp3?filename=heartbeat-110957.mp3">
</audio>

<script>
let tiempo = 0;

/* cada segundo aumenta el nivel */
setInterval(() => {
    tiempo++;

    // Intensidad (máx 100)
    let intensidad = Math.min(tiempo / 2, 100);

    /* OSCURECER */
    document.body.style.filter = `
        brightness(${100 - intensidad * 0.3}%)
        contrast(${100 + intensidad}%)
    `;

    /* GLITCH MÁS FRECUENTE */
    if (Math.random() < intensidad / 120) {
        document.body.style.transform = "translate(3px,-3px)";
        setTimeout(() => {
            document.body.style.transform = "translate(0,0)";
        }, 80);
    }

    /* MENSAJES MÁS SEGUIDOS */
    if (Math.random() < intensidad / 150) {
        const frasesExtra = [
            "Sigue aquí...",
            "No puedes salir...",
            "El dolor vuelve...",
            "Ya es tarde...",
            "Tu cuerpo lo recuerda..."
        ];

        mensaje.innerText = frasesExtra[Math.floor(Math.random() * frasesExtra.length)];
        mensaje.style.opacity = 1;

        setTimeout(() => {
            mensaje.style.opacity = 0;
        }, 1500);
    }

    /* LATIDO MÁS INTENSO */
    if (intensidad > 20) {
        document.body.style.animation = "latidoGlobal 1s infinite";
    }

}, 1000);

/* ANIMACIÓN LATIDO GLOBAL */
const style = document.createElement('style');
style.innerHTML = `
@keyframes latidoGlobal {
    0% { transform: scale(1); }
    50% { transform: scale(1.01); }
    100% { transform: scale(1); }
}`;
document.head.appendChild(style);
</script>





<script>
const audio = document.getElementById('audio');
const boton = document.querySelector('.contacto');
const mensaje = document.getElementById('mensaje');

/* SONIDO */
boton.addEventListener('mouseenter', () => {
    audio.currentTime = 0;
    audio.volume = 0.4;
    audio.play();
});

/* MENSAJES */
const frases = [
    "No debiste mirar...",
    "Sigue doliendo...",
    "No termina...",
    "Recuerda ese momento...",
    "No puedes escapar..."
];

setInterval(()=>{
    if(Math.random()<0.3){
        mensaje.innerText = frases[Math.floor(Math.random()*frases.length)];
        mensaje.style.opacity = 2;
        setTimeout(()=>mensaje.style.opacity=0,2000);
    }
},6000);

/* GLITCH */
setInterval(()=>{
    if(Math.random()<0.3){
        document.body.style.transform = "translate(2px,-2px)";
        setTimeout(()=>document.body.style.transform="translate(0,0)",100);
    }
},3000);
</script>
