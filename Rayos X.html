/* NAV */
nav {
    position: fixed;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 15px;
    z-index: 1000;

/* BOTÓN CRUZ */
.contacto {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    background: red;
    border-radius: 10px;
    animation: miedo 1.2s infinite;
}

.contacto::before,
.contacto::after {
    content: '';
    position: absolute;
    background: white;
}

.contacto::before {
    width: 15px;
    height: 40px;
    top: 10px;
    left: 22px;
}

.contacto::after {
    width: 40px;
    height: 15px;
    top: 22px;
    left: 10px;
}

@keyframes miedo {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* CONTENIDO */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 80px 20px;

h1 {
    text-align: center;

/* GALERÍA */
.grid {

    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 15px;
    margin-top: 20px;
}

.grid img {
    width: 100%;
    border-radius: 10px;
    transition: 0.3s;
}

.grid img:hover {
    transform: scale(1.05);
}
</style>
